<svg xmlns="http://www.w3.org/2000/svg" width="760" height="212" viewBox="0 0 760 212" role="img" aria-label="展开后的小分类">
  <defs>
    <style>
      .card { fill: #1e1f23; stroke: #2c2e33; }
