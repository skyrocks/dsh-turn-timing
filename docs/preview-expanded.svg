  <text x="700" y="31" class="mono" font-size="9" fill="#6b7280" opacity="0.5">▴</text>

  <rect class="panel" x="1" y="46" width="758" height="154" rx="8"/>

  <circle cx="26" cy="70" r="2.5" fill="#5b74e0" opacity="0.9"/>
  <text x="34" y="74" class="mono" font-size="11.5" fill="#8a8f98">模型</text>
  <text x="132" y="74" class="mono" font-size="12" fill="#c9cdd4" font-weight="500" text-anchor="end">1m50s</text>
  <rect x="142" y="69" width="44" height="3" rx="1.5" fill="#2c2e33"/>
  <rect x="142" y="69" width="30.6" height="3" rx="1.5" fill="#5b74e0"/>
  <text x="198" y="74" class="mono" font-size="11" fill="#8a8f98" opacity="0.85">等首字 1m20s · 思考 25s · 输出 5s</text>

  <circle cx="26" cy="94" r="2.5" fill="#4aa87a" opacity="0.9"/>
  <text x="34" y="98" class="mono" font-size="11.5" fill="#8a8f98">编码</text>
  <text x="132" y="98" class="mono" font-size="12" fill="#c9cdd4" font-weight="500" text-anchor="end">12s</text>
  <rect x="142" y="93" width="44" height="3" rx="1.5" fill="#2c2e33"/>
  <rect x="142" y="93" width="3.3" height="3" rx="1.5" fill="#4aa87a"/>
  <text x="198" y="98" class="mono" font-size="11" fill="#8a8f98" opacity="0.85">编辑 8s · 其他命令 4s</text>

  <circle cx="26" cy="118" r="2.5" fill="#c68a4a" opacity="0.9"/>
  <text x="34" y="122" class="mono" font-size="11.5" fill="#8a8f98">构建</text>
  <text x="132" y="122" class="mono" font-size="12" fill="#c9cdd4" font-weight="500" text-anchor="end">20s</text>
  <rect x="142" y="117" width="44" height="3" rx="1.5" fill="#2c2e33"/>
  <rect x="142" y="117" width="5.6" height="3" rx="1.5" fill="#c68a4a"/>
  <text x="198" y="122" class="mono" font-size="11" fill="#8a8f98" opacity="0.85">构建 14s · 静态检查 6s</text>

  <circle cx="26" cy="142" r="2.5" fill="#bf6577" opacity="0.9"/>
  <text x="34" y="146" class="mono" font-size="11.5" fill="#8a8f98">测试</text>
  <text x="132" y="146" class="mono" font-size="12" fill="#c9cdd4" font-weight="500" text-anchor="end">16s</text>
  <rect x="142" y="141" width="44" height="3" rx="1.5" fill="#2c2e33"/>
  <rect x="142" y="141" width="4.5" height="3" rx="1.5" fill="#bf6577"/>
  <text x="198" y="146" class="mono" font-size="11" fill="#8a8f98" opacity="0.85">识图 11s* · 浏览器 5s</text>

